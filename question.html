<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#156082">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Question - Learning Maths in Baby Steps</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="question.css">
    <script type="module">
        // Initialize Firebase for active sessions tracking
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBqCWeT44wwh92OL_8O0-j4IBwLeOaGSmc",
            authDomain: "maths-in-baby-steps.firebaseapp.com",
            projectId: "maths-in-baby-steps",
            storageBucket: "maths-in-baby-steps.firebasestorage.app",
            messagingSenderId: "235467885199",
            appId: "1:235467885199:web:dff119a28e6f897d1dfefa",
            measurementId: "G-XKB7TT32RL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Expose Firebase globally
        window.questionAuth = auth;
        window.questionDb = db;
        
        /**
         * Update active session in Firestore (matches Supabase structure exactly)
         * Called when student starts quiz or answers each question
         */
        window.updateActiveSession = async function(operation, variant, questionNo, isCorrect, totalQuestions) {
            try {
                const user = auth.currentUser;
                if (!user || !user.uid) {
                    // Not logged in - silently skip (anonymous users don't track active sessions)
                    return;
                }
                
                // Use user_code as document ID (one record per user_code).
                // Fallback to UID only if user_code is unavailable (should not happen for normal students).
                let userCode = null;
                try {
                    const profileStr =
                        sessionStorage.getItem('quizUserProfile') ||
                        sessionStorage.getItem('currentUserProfile');
                    if (profileStr) {
                        const profile = JSON.parse(profileStr);
                        userCode = profile?.user_code ? String(profile.user_code).trim() : null;
                    }
                } catch (e) {
                    userCode = null;
                }

                const userId = user.uid;
                const sessionDocId = userCode || userId;
                const sessionRef = doc(db, 'active_sessions', sessionDocId);
                
                // Update or create active session document
                await setDoc(sessionRef, {
                    user_id: userId,
                    user_code: userCode || null,
                    operation: operation,
                    variant: variant,
                    last_question_no_completed: questionNo,
                    last_question_correct_wrong: isCorrect !== undefined ? isCorrect : null,
                    total_questions: totalQuestions,
                    last_activity: serverTimestamp()
                }, { merge: true });
                
                if (window.debugLog) {
                    window.debugLog('updateActiveSession', `Updated: ${operation}/${variant}, Q${questionNo}/${totalQuestions}`);
                }
            } catch (error) {
                // Silently fail - don't interrupt student's quiz flow
                console.warn('⚠️ Could not update active session:', error.message);
            }
        };
        
        /**
         * Clear active session from Firestore (when quiz completes or is abandoned)
         * Called when student completes quiz or abandons it
         */
        window.clearActiveSession = async function() {
            try {
                const user = auth.currentUser;
                if (!user || !user.uid) {
                    return;
                }
                
                // Delete by the same document id we used when writing.
                let userCode = null;
                try {
                    const profileStr =
                        sessionStorage.getItem('quizUserProfile') ||
                        sessionStorage.getItem('currentUserProfile');
                    if (profileStr) {
                        const profile = JSON.parse(profileStr);
                        userCode = profile?.user_code ? String(profile.user_code).trim() : null;
                    }
                } catch (e) {
                    userCode = null;
                }

                const userId = user.uid;
                // Delete both possible document IDs to avoid leaving stale records
                // if sessionStorage/profile isn't available consistently.
                const docIdsToDelete = new Set([userId]);
                if (userCode) docIdsToDelete.add(userCode);

                for (const sessionDocId of docIdsToDelete) {
                    const sessionRef = doc(db, 'active_sessions', sessionDocId);
                    await deleteDoc(sessionRef);
                }
                
                if (window.debugLog) {
                    window.debugLog('clearActiveSession', 'Cleared active session');
                }
            } catch (error) {
                // Silently fail - don't interrupt flow
                console.warn('⚠️ Could not clear active session:', error.message);
            }
        };
        
        console.log('✅ Firebase initialized in question page for active sessions');
    </script>
    <script src="shared.js"></script>
    <script src="summary.js"></script>
    <script src="question.js"></script>
    <script>
        // Disable service worker during development to avoid caching issues
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister().then(function(boolean) {
                        console.log('Service Worker unregistered:', boolean);
                    });
                }
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Question Answer Page -->
        <div id="questionSection" class="question-container">
            <div class="dashboard-header">
                <h1 class="dashboard-title">Learning Maths in Baby Steps</h1>
                <div class="user-info-bar">
                    <span id="questionUserNameDisplay">Name: </span>
                    <span id="questionUserClassDisplay">Class: </span>
                    <span id="questionUserRollDisplay">Roll Number: </span>
                </div>
                <div class="user-info-bar">
                    <span id="questionOperationDisplay">Operation: </span>
                    <span id="questionVariantDisplay">Variant: </span>
                </div>
                <div class="dashboard-buttons-grid">
                    <button class="btn btn-auth" onclick="goBackToDashboard()">Dashboard</button>
                </div>
            </div>
            
            <div class="question-block">
                <div class="progress-tracker">
                    <div class="progress-text" id="progressText">0 / 0</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
                <div class="timer hidden" id="timer">Time: 0.0s</div>
                <div class="question-line" id="line1"></div>
                <div class="question-line" id="line2"></div>
                <div class="math-divider" id="mathDivider"></div>
                <div class="question-line answer-line" id="answerLine">
                    <div id="answerCellsContainer" class="answer-cells-container hidden"></div>
                    <div class="question-line correct-answer-line hidden" id="correctAnswerLine"></div>
                    <input type="number" id="answerInput" class="answer-input" placeholder="?" autocomplete="off">
                    <div id="answerDisplay" class="answer-display hidden" tabindex="0">
                        <input type="text" id="hiddenInput" class="hidden-input" autocomplete="off">
                    </div>
                    <table id="multidigitTable" class="multidigit-table hidden"></table>
                    <input type="tel" id="mobileAnswerInput" class="mobile-answer-input hidden" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
                </div>
                <div class="correct-answer" id="line4"></div>
            </div>
            
            <div class="quiz-controls hidden" id="quizControls">
                <button class="btn btn-quiz" id="onHoldBtn" onclick="handleOnHold()">On Hold</button>
                <button class="btn btn-quiz" id="tryAgainBtn" onclick="handleTryAgain()">Try Again</button>
                <button class="btn btn-quiz" id="nextQuestionBtn" onclick="handleNextQuestion()">Next Question</button>
                <button class="btn btn-quiz" id="nextAssignmentBtn" onclick="handleNextAssignment()">Next Assignment</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Get operation and variant from sessionStorage
            const operation = sessionStorage.getItem('quizOperation');
            const variant = sessionStorage.getItem('quizVariant');
            
            if (operation && variant) {
                // Update header
                setTimeout(() => {
                    if (typeof updateQuestionPageHeader === 'function') {
                        updateQuestionPageHeader();
                    }
                    // Start the quiz session
                    if (typeof startSession === 'function') {
                        startSession(operation, variant);
                    }
                }, 500);
            } else {
                // No operation/variant, redirect to dashboard
                console.warn('No operation/variant found, redirecting to dashboard');
                window.location.href = 'student-dashboard.html';
            }
        });
    </script>
</body>
</html>
