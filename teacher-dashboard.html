<!DOCTYPE html>
<!--
    REQUIREMENTS:
    - Teacher dashboard for viewing student progress across all variants
    - Displays progress table with students as rows and variants as columns
    - Shows pass/fail status for each student-variant combination
    - Supports Excel export functionality
    - Requires teacher authentication
    
    REFERENCED BY:
    - teacher-dashboard.js: loadDashboard(), buildProgressTable(), exportToExcel()
    - teacher-dashboard.css (all styles)
    - Firebase: Fetches student data and progress from Firestore database
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#156082">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dashboard - Student Progress</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="teacher-dashboard.css">
    <script src="auth-utils.js"></script>
    <!-- ExcelJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script>
        // Disable service worker during development to avoid caching issues
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister().then(function(boolean) {
                        console.log('Service Worker unregistered:', boolean);
                    });
                }
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <!--
            REQUIREMENTS:
            - Header with title and user info
            - Shows teacher name and logout button
            
            REFERENCED BY:
            - teacher-dashboard.js: loadDashboard() (sets teacherName)
            - teacher-dashboard.css (.header, .user-info)
        -->
        <header class="header">
            <h1>Dashboard - Student Progress</h1>
            <div class="user-info">
                <button id="studentDashboardBtn" class="btn btn-secondary">Student Dashboard</button>
                <button id="logoutBtn" class="btn btn-secondary">Log Out</button>
            </div>
        </header>

        <!--
            REQUIREMENTS:
            - Loading message shown while fetching data
            - Hidden when data is loaded
            
            REFERENCED BY:
            - teacher-dashboard.js: showLoading() (shows/hides)
            - teacher-dashboard.css (.loading-message)
        -->
        <div id="loadingMessage" class="loading-message">
            Loading student data...
        </div>

        <!--
            REQUIREMENTS:
            - Error message displayed when data fetch fails
            - Hidden by default, shown by showError()
            
            REFERENCED BY:
            - teacher-dashboard.js: showError() (adds/removes 'hidden' class)
            - teacher-dashboard.css (.error-message, .hidden)
        -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!--
            REQUIREMENTS:
            - School and class selection dropdowns
            - Hidden by default, shown when multiple schools/classes available
            
            REFERENCED BY:
            - teacher-dashboard.js: renderSchoolClassSelectors() (creates and populates dropdowns)
            - teacher-dashboard.css (.school-class-selectors)
        -->
        <div id="schoolClassSelectors" class="school-class-selectors hidden"></div>

        <!--
            REQUIREMENTS:
            - Dashboard controls with export button and statistics
            - Hidden by default, shown when data is loaded
            
            REFERENCED BY:
            - teacher-dashboard.js: loadDashboard() (removes 'hidden' class, sets studentCount and variantCount)
            - teacher-dashboard.css (.dashboard-controls, .stats)
        -->
        <div id="dashboardControls" class="dashboard-controls hidden">
            <button id="exportBtn" class="btn btn-primary" onclick="exportToExcel()">
                Export to Excel
            </button>
            <button type="button" id="toggleDebugActivityColsBtn" class="btn btn-secondary dashboard-toolbar-icon-btn" onclick="toggleDebugActivityColumns()" aria-label="Show activity columns" title="Show activity columns"></button>
            <div class="operation-toggle-buttons">
                <button class="btn btn-toggle" data-operation="1" onclick="toggleOperation(1)">▼ 1</button>
                <button class="btn btn-toggle" data-operation="2" onclick="toggleOperation(2)">▼ 2</button>
                <button class="btn btn-toggle" data-operation="3" onclick="toggleOperation(3)">▼ 3</button>
                <button class="btn btn-toggle" data-operation="4" onclick="toggleOperation(4)">▼ 4</button>
            </div>
            <div id="variantStateFilterPanel" class="variant-state-filter hidden"></div>
            <div class="stats">
                <span>Total Students: <strong id="studentCount">0</strong></span>
                <span>Total Variants: <strong id="variantCount">0</strong></span>
            </div>
        </div>

        <!--
            REQUIREMENTS:
            - Grid container for progress table
            - Contains scrollable table with students and variants
            - Hidden by default, shown when data is loaded
            
            REFERENCED BY:
            - teacher-dashboard.js: loadDashboard() (removes 'hidden' class), buildProgressTable() (populates table)
            - teacher-dashboard.css (.dashboard-grid-container, .grid-wrapper, .progress-table)
        -->
        <div id="dashboardGrid" class="dashboard-grid-container hidden">
            <div class="grid-wrapper">
                <table id="progressTable" class="progress-table hide-debug-activity-columns">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        // Initialize Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
        import { getFirestore, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBqCWeT44wwh92OL_8O0-j4IBwLeOaGSmc",
            authDomain: "maths-in-baby-steps.firebaseapp.com",
            projectId: "maths-in-baby-steps",
            storageBucket: "maths-in-baby-steps.firebasestorage.app",
            messagingSenderId: "235467885199",
            appId: "1:235467885199:web:dff119a28e6f897d1dfefa",
            measurementId: "G-XKB7TT32RL"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        console.log('✅ Firebase initialized in teacher dashboard');
        
        // Expose Firebase instances globally for teacher-dashboard.js
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseSignOut = signOut;

        // Clear active session tracking (used by auth-utils.js on logout).
        // This is best-effort: deleting non-existent docs is harmless.
        window.clearActiveSession = async function() {
            try {
                const user = auth?.currentUser || window.firebaseAuth?.currentUser;
                if (!user || !user.uid) return;

                let userCode = null;
                try {
                    const profileStr =
                        sessionStorage.getItem('currentUserProfile') ||
                        sessionStorage.getItem('quizUserProfile');
                    if (profileStr) {
                        const profile = JSON.parse(profileStr);
                        userCode = profile?.user_code ? String(profile.user_code).trim() : null;
                    }
                } catch (e) {
                    userCode = null;
                }

                const userId = user.uid;
                const docIdsToDelete = new Set([userId]);
                if (userCode) docIdsToDelete.add(userCode);

                for (const sessionDocId of docIdsToDelete) {
                    const sessionRef = doc(db, 'active_sessions', sessionDocId);
                    await deleteDoc(sessionRef);
                }
            } catch (e) {
                console.warn('Could not clear active session:', e?.message || e);
            }
        };
        
        // Handle logout button
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                if (typeof window.handleLogoutCommon === 'function') {
                    await window.handleLogoutCommon({ auth, redirectTo: 'index.html' });
                    return;
                }
                await signOut(auth);
                sessionStorage.removeItem('currentUserProfile');
                window.location.href = 'index.html';
            } catch (error) {
                console.error('❌ Sign out error:', error);
                alert('Error signing out: ' + error.message);
            }
        });
        
        // Handle student dashboard button
        document.getElementById('studentDashboardBtn').addEventListener('click', () => {
            window.location.href = 'student-dashboard.html';
        });
        
        // Monitor auth state and initialize dashboard
        onAuthStateChanged(auth, async (user) => {
            console.log('🔔 Auth state changed:', user ? `User: ${user.email}` : 'No user');
            
            if (user) {
                console.log('✅ User is signed in:', user.email);
                console.log('🔍 Checking sessionStorage for profile...');
                
                // Load user profile from sessionStorage
                let userProfile = null;
                try {
                    const profileStr = sessionStorage.getItem('currentUserProfile');
                    console.log('📦 Profile from sessionStorage:', profileStr ? 'Found' : 'Not found');
                    if (profileStr) {
                        userProfile = JSON.parse(profileStr);
                        console.log('✅ User profile loaded from sessionStorage');
                        console.log('📋 Full profile:', userProfile);
                        console.log('👤 User type:', userProfile ? userProfile.user_type : 'undefined');
                    }
                } catch (e) {
                    console.error('❌ Error loading user profile from sessionStorage:', e);
                }
                
                // If no profile in sessionStorage, fetch from Firestore
                if (!userProfile) {
                    console.log('🔍 Profile not in sessionStorage, fetching from Firestore...');
                    try {
                        const { collection, query, where, getDocs } = await import("https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js");
                        
                        // Try querying by user_id (Firebase Auth UID) first
                        console.log('🔍 Querying by user_id (Firebase Auth UID):', user.uid);
                        const profilesRef = collection(db, 'user_profiles');
                        const q = query(profilesRef, where('user_id', '==', user.uid));
                        const querySnapshot = await getDocs(q);
                        
                        if (!querySnapshot.empty) {
                            // Found by user_id
                            querySnapshot.forEach((doc) => {
                                userProfile = doc.data();
                                console.log('✅ User profile fetched from Firestore by user_id');
                            });
                        } else {
                            // Try querying by email as fallback
                            console.log('🔍 Not found by user_id, trying email:', user.email);
                            const emailQuery = query(profilesRef, where('email', '==', user.email));
                            const emailSnapshot = await getDocs(emailQuery);
                            
                            if (!emailSnapshot.empty) {
                                emailSnapshot.forEach((doc) => {
                                    userProfile = doc.data();
                                    console.log('✅ User profile fetched from Firestore by email');
                                });
                            } else {
                                // Last resort: try user_code as document ID (if email format matches pattern)
                                console.log('🔍 Not found by email, trying user_code as document ID...');
                                const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js");
                                // Try extracting user code from email (format: user_code@mathsbaby.app)
                                const userCode = user.email.split('@')[0];
                                const profileRef = doc(db, 'user_profiles', userCode);
                                const profileSnap = await getDoc(profileRef);
                                if (profileSnap.exists()) {
                                    userProfile = profileSnap.data();
                                    console.log('✅ User profile fetched from Firestore by user_code document ID');
                                }
                            }
                        }
                        
                        if (userProfile) {
                            console.log('✅ User profile fetched from Firestore');
                            console.log('📋 Full profile:', userProfile);
                            console.log('👤 User type:', userProfile.user_type);
                            sessionStorage.setItem('currentUserProfile', JSON.stringify(userProfile));
                        } else {
                            console.warn('⚠️ Profile not found in Firestore');
                            console.warn('⚠️ Email:', user.email);
                            console.warn('⚠️ UID:', user.uid);
                        }
                    } catch (error) {
                        console.error('❌ Error fetching user profile from Firestore:', error);
                        console.error('❌ Error details:', error.message, error.stack);
                    }
                }
                
                // Check if user is a teacher
                if (!userProfile) {
                    console.error('❌ No user profile found - cannot determine user type');
                    console.log('🔄 Redirecting to login page...');
                    window.location.href = 'index.html';
                    return;
                }
                
                console.log('🔍 Checking user type...');
                console.log('👤 User type value:', userProfile.user_type);
                console.log('🔍 Is Teacher?', userProfile.user_type === 'Teacher');
                
                if (userProfile.user_type === 'Teacher') {
                    console.log('✅ User is a teacher, initializing dashboard...');
                    // Expose user and profile globally
                    window.currentUser = user;
                    window.currentUserProfile = userProfile;
                    
                    // Wait a moment for teacher-dashboard.js to load
                    const tryInit = () => {
                        if (window.initDashboard) {
                            console.log('🚀 Calling initDashboard...');
                            window.initDashboard();
                        } else {
                            console.warn('⚠️ initDashboard function not found, waiting...');
                            setTimeout(tryInit, 100);
                        }
                    };
                    
                    // Start trying immediately, but also set a timeout
                    tryInit();
                    setTimeout(() => {
                        if (!window.initDashboard) {
                            console.error('❌ initDashboard still not found after 2 seconds');
                            console.error('❌ Available window functions:', Object.keys(window).filter(k => k.includes('init') || k.includes('dashboard')));
                        }
                    }, 2000);
                } else {
                    console.warn('⚠️ User is not a teacher');
                    console.log('📋 User profile:', userProfile);
                    console.log('👤 User type:', userProfile.user_type);
                    console.log('🔄 Redirecting to student dashboard...');
                    window.location.href = 'student-dashboard.html';
                }
            } else {
                console.log('ℹ️ User is signed out - redirecting to login');
                window.location.href = 'index.html';
            }
        });
    </script>
    <script src="teacher-dashboard.js"></script>
</body>
</html>
